<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta · Reservas Deportivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style/styles.css">
<link rel="stylesheet" href="style/auth.css">
</head>
<body class="auth-page">

  <main class="auth-main">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="brand__mark">●</span>
      <span class="brand__name">RESERVAS<span class="brand__name--accent">DEPORTIVAS</span></span>
    </div>

    <h1>Crear cuenta</h1>

    <form id="formRegistro" novalidate>
      <div class="field">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Ej. Laura Gómez" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="tucorreo@ejemplo.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="contrasena">Contraseña</label>
        <div class="pw-wrap">
          <input type="password" id="contrasena" name="contrasena" required minlength="8" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
          <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="contrasena">
          <svg class="pw-icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
            <circle cx="12" cy="12" r="3"/>
            <line class="pw-tachado" x1="3" y1="3" x2="21" y2="21"/>
          </svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="contrasena2">Repite la contraseña</label>
        <div class="pw-wrap">
          <input type="password" id="contrasena2" name="contrasena2" required minlength="8" placeholder="Repite la contraseña" autocomplete="new-password">
          <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="contrasena2">
          <svg class="pw-icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
            <circle cx="12" cy="12" r="3"/>
            <line class="pw-tachado" x1="3" y1="3" x2="21" y2="21"/>
          </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--block">Registrarse</button>
      <p class="auth-error" id="authError"></p>
      <p class="auth-success" id="authSuccess"></p>
    </form>

    <p class="auth-card__footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </div>
  </main>

  <script>
    // Botón "ver contraseña": alterna entre ocultarla y mostrarla mientras se escribe
    document.querySelectorAll('.pw-toggle').forEach((boton) => {
      boton.addEventListener('click', () => {
        const campo = document.getElementById(boton.getAttribute('aria-controls'));
        const visible = campo.type === 'password';
        campo.type = visible ? 'text' : 'password';
        boton.setAttribute('aria-pressed', String(visible));
        boton.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
        boton.classList.toggle('is-visible', visible);
        campo.focus();
      });
    });

    const formRegistro = document.getElementById('formRegistro');
    const authError = document.getElementById('authError');
    const authSuccess = document.getElementById('authSuccess');

    formRegistro.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      authError.textContent = '';
      authSuccess.textContent = '';

      const datos = new FormData(formRegistro);
      const contrasena = datos.get('contrasena');
      const contrasena2 = datos.get('contrasena2');

      if (contrasena !== contrasena2) {
        authError.textContent = 'Las contraseñas no coinciden.';
        return;
      }

      const boton = formRegistro.querySelector('button[type="submit"]');
      boton.disabled = true;

      try {
        const resp = await fetch('db/registro.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: datos.get('nombre').trim(),
            email: datos.get('email').trim(),
            contrasena,
          }),
        });
        const data = await resp.json();

        if (!data.ok) {
          authError.textContent = data.error || 'No se pudo completar el registro.';
          return;
        }

        authSuccess.textContent = 'Cuenta creada correctamente. Redirigiendo a inicio de sesión…';
        setTimeout(() => { window.location.href = 'login.html'; }, 1800);
      } catch (err) {
        authError.textContent = 'Error de conexión con el servidor.';
      } finally {
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
