<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Reservas Deportivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style/styles.css">
<link rel="stylesheet" href="style/auth.css">
</head>
<body class="auth-page">

  <main class="auth-main">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="brand__mark">●</span>
      <span class="brand__name">RESERVAS<span class="brand__name--accent">DEPORTIVAS</span></span>
    </div>

    <h1>Iniciar sesión</h1>

    <form id="formLogin" novalidate>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="tucorreo@ejemplo.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="contrasena">Contraseña</label>
        <div class="pw-wrap">
          <input type="password" id="contrasena" name="contrasena" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="contrasena">
          <svg class="pw-icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
            <circle cx="12" cy="12" r="3"/>
            <line class="pw-tachado" x1="3" y1="3" x2="21" y2="21"/>
          </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--block">Entrar</button>
      <p class="auth-error" id="authError"></p>
    </form>

    <p class="auth-card__footer">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </div>
  </main>

  <script>
    // Botón "ver contraseña": alterna entre ocultarla y mostrarla mientras se escribe
    document.querySelectorAll('.pw-toggle').forEach((boton) => {
      boton.addEventListener('click', () => {
        const campo = document.getElementById(boton.getAttribute('aria-controls'));
        const visible = campo.type === 'password';
        campo.type = visible ? 'text' : 'password';
        boton.setAttribute('aria-pressed', String(visible));
        boton.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
        boton.classList.toggle('is-visible', visible);
        campo.focus();
      });
    });

    const formLogin = document.getElementById('formLogin');
    const authError = document.getElementById('authError');

    formLogin.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      authError.textContent = '';

      const datos = new FormData(formLogin);
      const boton = formLogin.querySelector('button[type="submit"]');
      boton.disabled = true;

      try {
        const resp = await fetch('db/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: datos.get('email').trim(),
            contrasena: datos.get('contrasena'),
          }),
        });
        const data = await resp.json();

        if (!data.ok) {
          authError.textContent = data.error || 'No se pudo iniciar sesión.';
          return;
        }

        window.location.href = data.usuario.rol === 'admin' ? 'admin.html' : 'index.html';
      } catch (err) {
        authError.textContent = 'Error de conexión con el servidor.';
      } finally {
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
