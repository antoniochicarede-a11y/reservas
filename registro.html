<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta · Reservas Deportivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style/styles.css">
<link rel="stylesheet" href="style/auth.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <!-- CAMBIA "PON-AQUI-TU-IMAGEN.jpg" por la ruta o URL de tu imagen -->
    <img src="PON-AQUI-TU-IMAGEN.jpg" alt="Reservas Deportivas" class="auth-card__image">

    <div class="auth-card__brand">
      <span class="brand__mark">●</span>
      <span class="brand__name">RESERVAS<span class="brand__name--accent">DEPORTIVAS</span></span>
    </div>

    <h1>Crear cuenta</h1>

    <form id="formRegistro" novalidate>
      <label class="field">
        <span>Nombre completo</span>
        <input type="text" name="nombre" required placeholder="Ej. Laura Gómez">
      </label>
      <label class="field">
        <span>Correo electrónico</span>
        <input type="email" name="email" required placeholder="tucorreo@ejemplo.com" autocomplete="username">
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" name="contrasena" required minlength="8" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
      </label>
      <label class="field">
        <span>Repite la contraseña</span>
        <input type="password" name="contrasena2" required minlength="8" placeholder="Repite la contraseña" autocomplete="new-password">
      </label>

      <button type="submit" class="btn btn--primary btn--block">Registrarse</button>
      <p class="auth-error" id="authError"></p>
      <p class="auth-success" id="authSuccess"></p>
    </form>

    <p class="auth-card__footer">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </div>

  <script>
    const formRegistro = document.getElementById('formRegistro');
    const authError = document.getElementById('authError');
    const authSuccess = document.getElementById('authSuccess');

    formRegistro.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      authError.textContent = '';
      authSuccess.textContent = '';

      const datos = new FormData(formRegistro);
      const contrasena = datos.get('contrasena');
      const contrasena2 = datos.get('contrasena2');

      if (contrasena !== contrasena2) {
        authError.textContent = 'Las contraseñas no coinciden.';
        return;
      }

      const boton = formRegistro.querySelector('button[type="submit"]');
      boton.disabled = true;

      try {
        const resp = await fetch('db/registro.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: datos.get('nombre').trim(),
            email: datos.get('email').trim(),
            contrasena,
          }),
        });
        const data = await resp.json();

        if (!data.ok) {
          authError.textContent = data.error || 'No se pudo completar el registro.';
          return;
        }

        authSuccess.textContent = 'Cuenta creada correctamente. Redirigiendo a inicio de sesión…';
        setTimeout(() => { window.location.href = 'login.html'; }, 1800);
      } catch (err) {
        authError.textContent = 'Error de conexión con el servidor.';
      } finally {
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
